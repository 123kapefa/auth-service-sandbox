services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrator:
    build:
      context: .
      target: migrator
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Bootstrap__Enabled: ${BOOTSTRAP_ENABLED}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL}
      Bootstrap__AdminUserName: ${BOOTSTRAP_ADMIN_USERNAME}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD}
      Bootstrap__DevServiceSecret: ${DEV_SERVICE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
