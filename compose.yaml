services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Порт наружу — для окружения Development: приложение, запущенное на машине (dotnet run),
    # ходит в базу через localhost. Контейнерам он не нужен, они ходят по имени postgres.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Отметки мгновенного отзыва токенов (этап 4.8): пишет сервис входа, читают все сервисы платформы.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Порт наружу — для окружения Development (dotnet run на машине).
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Миграции базы сервиса: efbundle из образа сервиса (стандарт платформы — мигратор-sidecar). Отрабатывает и
  # завершается; сервис ждёт его успеха. Образ собирается здесь, сервис берёт его по имени.
  auth-migrator:
    build:
      context: .
      target: api
    image: auth_service-api:local
    entrypoint: ["./efbundle", "--connection", "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"]
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    image: auth_service-api:local
    # dotnet не должен быть PID 1: иначе упавший при старте процесс зависает, а контейнер остаётся "running".
    init: true
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Keycloak__ClientSecret: ${SANDBOX_BFF_CLIENT_SECRET}
      # Разрешение на регистрацию клиентов — выдача ключей сервисам (scripts/keycloak/registration-token.sh).
      Keycloak__RegistrationToken: ${KEYCLOAK_REGISTRATION_TOKEN:-}
      ConnectionStrings__Redis: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrator:
        condition: service_completed_successfully

  # --- Keycloak (этап 1, docs/keycloak/01-stand.md) ---------------------------------
  # Отдельная БД: в реальных проектах Keycloak не делит базу с приложениями.
  keycloak-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    # Свой образ: Keycloak 26.4.7 + плагин «вход по коду» и тема входа platform (Keycloakify) — собираются в Docker.
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    image: auth_service-keycloak:26.4.7-sandbox
    # start-dev: http, без кэша тем, подробные ошибки. Realm импортируется из JSON,
    # только если его ещё нет в БД (изменили JSON → docker compose down -v).
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Адрес, от которого зависит `iss` в токенах: браузер и приложения должны видеть один и тот же.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      # Служебные адреса (jwks_uri, token_endpoint) — по адресу, с которого пришёл запрос:
      # контейнер, спросивший keycloak:8180, получит ключи с keycloak:8180, а iss останется localhost:8180.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Подставляются в realm JSON при импорте (${SANDBOX_BFF_CLIENT_SECRET}, ${LEGACY_IMPORT_CLIENT_SECRET}).
      SANDBOX_BFF_CLIENT_SECRET: ${SANDBOX_BFF_CLIENT_SECRET}
      LEGACY_IMPORT_CLIENT_SECRET: ${LEGACY_IMPORT_CLIENT_SECRET}
      # Вход через Госуслуги и Яндекс ID (docs/keycloak/09-external-login.md). По умолчанию — заглушка idp-stub:
      # в браузере — localhost, из Keycloak — по имени контейнера. Настоящие ключи и адреса — в .env.
      ESIA_CLIENT_ID: ${ESIA_CLIENT_ID:-SANDBOX}
      ESIA_AUTHORIZATION_URL: ${ESIA_AUTHORIZATION_URL:-http://localhost:${IDP_STUB_PORT:-8190}/esia/aas/oauth2/v2/ac}
      ESIA_TOKEN_URL: ${ESIA_TOKEN_URL:-http://idp-stub:8190/esia/aas/oauth2/v3/te}
      ESIA_API_URL: ${ESIA_API_URL:-http://idp-stub:8190/esia}
      ESIA_SIGNER_URL: ${ESIA_SIGNER_URL:-http://idp-stub:8190/sign}
      ESIA_CERTIFICATE_HASH: ${ESIA_CERTIFICATE_HASH:-sandbox-certificate-hash}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-sandbox-yandex}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-sandbox-yandex-secret}
      YANDEX_AUTHORIZATION_URL: ${YANDEX_AUTHORIZATION_URL:-http://localhost:${IDP_STUB_PORT:-8190}/yandex/authorize}
      YANDEX_TOKEN_URL: ${YANDEX_TOKEN_URL:-http://idp-stub:8190/yandex/token}
      YANDEX_USER_INFO_URL: ${YANDEX_USER_INFO_URL:-http://idp-stub:8190/yandex/info?format=json}
      # Защита от накрутки кодов (docs/keycloak/10-code-limits.md). Боевые лимиты — по умолчанию в плагине; на стенде
      # они ослаблены: скрипты проверки шлют коды с одного IP на одни и те же номера. check-code-limits.sh включает
      # боевые значения на время проверки (атрибутами realm). Капча — заглушка: проходит токен sandbox-captcha-ok.
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__COOLDOWNS: "60"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__TARGET_PER_HOUR: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__TARGET_PER_DAY: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__IP_PER_HOUR: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__RANGE_PER_HOUR: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__CAPTCHA_AFTER: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__DAILY_BUDGET: "0"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__CAPTCHA_STUB: "true"
      # IP человека — из X-Forwarded-For, как за прокси в бою: check-code-limits.sh проверяет лимиты «с IP» с разных адресов.
      KC_PROXY_HEADERS: xforwarded
      # Метрики Prometheus (/metrics на порту управления 9000): отправки кодов, расход, отказы.
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      # Тема входа — в образе (jar из login-theme/). Правки страниц без Keycloak — npm run dev в login-theme/.
    healthcheck:
      # В образе нет curl — спрашиваем management-порт 9000 через bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  # Заглушка Яндекс ID и Госуслуг (ЕСИА) и сервиса подписи ГОСТ — для входа без настоящих ключей (infra/idp-stub).
  # Только для песочницы: с настоящими ключами Keycloak ходит к Яндексу и ЕСИА, заглушка не нужна.
  idp-stub:
    image: python:3.13-alpine
    command: ["python", "/stub/stub.py"]
    environment:
      ESIA_CLIENT_ID: ${ESIA_CLIENT_ID:-SANDBOX}
      ESIA_CERTIFICATE_HASH: ${ESIA_CERTIFICATE_HASH:-sandbox-certificate-hash}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-sandbox-yandex}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-sandbox-yandex-secret}
    ports:
      - "${IDP_STUB_PORT:-8190}:8190"
    volumes:
      - ./infra/idp-stub:/stub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8190/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  keycloak_postgres_data:
