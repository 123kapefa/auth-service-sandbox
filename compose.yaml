services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Порт наружу — для окружения Development: приложение, запущенное на машине (dotnet run),
    # ходит в базу через localhost. Контейнерам он не нужен, они ходят по имени postgres.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Отметки мгновенного отзыва токенов (этап 4.8): пишет сервис входа, читают все сервисы платформы.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Порт наружу — для окружения Development (dotnet run на машине).
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Миграции базы сервиса: efbundle из образа сервиса (стандарт платформы — мигратор-sidecar). Отрабатывает и
  # завершается; сервис ждёт его успеха. Образ собирается здесь, сервис берёт его по имени.
  auth-migrator:
    build:
      context: .
      target: api
    image: auth_service-api:local
    entrypoint: ["./efbundle", "--connection", "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"]
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    image: auth_service-api:local
    # dotnet не должен быть PID 1: иначе упавший при старте процесс зависает, а контейнер остаётся "running".
    init: true
    ports:
      - "8080:8080"
      # Метрики Prometheus (Metrics:Port, 9100): только с этой машины; наружу не публикуются.
      - "127.0.0.1:${AUTH_METRICS_PORT:-9100}:9100"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      # Трассировка: пусто — spans никуда не уходят (идентификатор трассы в логах и ответах есть); адрес OTLP-коллектора — уходят.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${AUTH_OTEL_ENDPOINT:-}
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Keycloak__ClientSecret: ${SANDBOX_BFF_CLIENT_SECRET}
      # Прежний секрет — только на время смены (scripts/secrets/rotate-bff-secret.sh, docs/secrets.md).
      Keycloak__PreviousClientSecret: ${SANDBOX_BFF_CLIENT_SECRET_PREVIOUS:-}
      # Разрешение на регистрацию клиентов — выдача ключей сервисам (scripts/keycloak/registration-token.sh).
      Keycloak__RegistrationToken: ${KEYCLOAK_REGISTRATION_TOKEN:-}
      ConnectionStrings__Redis: redis:6379
      # Сертификат ключей DataProtection — PFX в base64 из хранилища секретов (scripts/secrets/run.sh); без хранилища
      # не задан, ключи в базе не шифруются (только стенд). Прежний — на время смены (rotate-data-protection-cert.sh).
      DataProtection__Certificate: ${AUTH_DATA_PROTECTION_CERT:-}
      DataProtection__CertificatePassword: ${AUTH_DATA_PROTECTION_CERT_PASSWORD:-}
      DataProtection__PreviousCertificate: ${AUTH_DATA_PROTECTION_PREVIOUS_CERT:-}
      DataProtection__PreviousCertificatePassword: ${AUTH_DATA_PROTECTION_PREVIOUS_CERT_PASSWORD:-}
      # Лимиты частоты запросов (13.4). На стенде все проверки приходят с одного адреса и входят десятки раз за минуту, поэтому лимиты
      # высокие; рабочие значения — в appsettings.json (RateLimiting), их проверяет scripts/keycloak/check-rate-limits.sh.
      RateLimiting__Login__PermitLimit: ${AUTH_RATE_LIMIT_LOGIN:-100000}
      RateLimiting__Refresh__PermitLimit: ${AUTH_RATE_LIMIT_REFRESH:-100000}
      RateLimiting__Services__PermitLimit: ${AUTH_RATE_LIMIT_SERVICES:-100000}
      RateLimiting__ServicesAnonymous__PermitLimit: ${AUTH_RATE_LIMIT_SERVICES_ANONYMOUS:-100000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrator:
        condition: service_completed_successfully
      realm-migrator:
        condition: service_completed_successfully

  # Миграции настроек проектов (realm): применяет недостающие ко всем проектам на Keycloak и завершается
  # (docs/migrations.md). Realm песочницы импортируется из JSON уже с последней версией — мигратору делать нечего.
  realm-migrator:
    build:
      context: .
      dockerfile: infra/realm-migrator/Dockerfile
    image: auth_service-realm-migrator:local
    environment:
      KC: http://keycloak:8180
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      keycloak:
        condition: service_healthy

  # --- Keycloak ---------------------------------
  # Отдельная БД: в реальных проектах Keycloak не делит базу с приложениями.
  keycloak-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    # Свой образ: Keycloak 26.4.7 + плагин «вход по коду» и тема входа platform (Keycloakify) — собираются в Docker.
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    image: auth_service-keycloak:26.4.7-sandbox
    # start-dev: http, без кэша тем, подробные ошибки. Realm импортируется из JSON,
    # только если его ещё нет в БД (изменили JSON → docker compose down -v).
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Адрес, от которого зависит `iss` в токенах: браузер и приложения должны видеть один и тот же.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      # Служебные адреса (jwks_uri, token_endpoint) — по адресу, с которого пришёл запрос:
      # контейнер, спросивший keycloak:8180, получит ключи с keycloak:8180, а iss останется localhost:8180.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Подставляются в realm JSON при импорте (${SANDBOX_BFF_CLIENT_SECRET}, ${LEGACY_IMPORT_CLIENT_SECRET}).
      SANDBOX_BFF_CLIENT_SECRET: ${SANDBOX_BFF_CLIENT_SECRET}
      LEGACY_IMPORT_CLIENT_SECRET: ${LEGACY_IMPORT_CLIENT_SECRET}
      # Вход через Госуслуги и Яндекс ID. По умолчанию — заглушка idp-stub:
      # в браузере — localhost, из Keycloak — по имени контейнера. Настоящие ключи и адреса — в .env.
      ESIA_CLIENT_ID: ${ESIA_CLIENT_ID:-SANDBOX}
      ESIA_AUTHORIZATION_URL: ${ESIA_AUTHORIZATION_URL:-http://localhost:${IDP_STUB_PORT:-8190}/esia/aas/oauth2/v2/ac}
      ESIA_TOKEN_URL: ${ESIA_TOKEN_URL:-http://idp-stub:8190/esia/aas/oauth2/v3/te}
      ESIA_API_URL: ${ESIA_API_URL:-http://idp-stub:8190/esia}
      ESIA_SIGNER_URL: ${ESIA_SIGNER_URL:-http://idp-stub:8190/sign}
      ESIA_CERTIFICATE_HASH: ${ESIA_CERTIFICATE_HASH:-sandbox-certificate-hash}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-sandbox-yandex}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-sandbox-yandex-secret}
      YANDEX_AUTHORIZATION_URL: ${YANDEX_AUTHORIZATION_URL:-http://localhost:${IDP_STUB_PORT:-8190}/yandex/authorize}
      YANDEX_TOKEN_URL: ${YANDEX_TOKEN_URL:-http://idp-stub:8190/yandex/token}
      YANDEX_USER_INFO_URL: ${YANDEX_USER_INFO_URL:-http://idp-stub:8190/yandex/info?format=json}
      # Защита от накрутки кодов. Боевые лимиты — по умолчанию в плагине; на стенде
      # они ослаблены: скрипты проверки шлют коды с одного IP на одни и те же номера. check-code-limits.sh включает
      # боевые значения на время проверки (атрибутами realm). Капча — заглушка: проходит токен sandbox-captcha-ok.
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__COOLDOWNS: "60"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__TARGET_PER_HOUR: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__TARGET_PER_DAY: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__IP_PER_HOUR: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__RANGE_PER_HOUR: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__CAPTCHA_AFTER: "1000"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__DAILY_BUDGET: "0"
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__CAPTCHA_STUB: "true"
      # IP человека — из X-Forwarded-For, как за прокси в бою: check-code-limits.sh проверяет лимиты «с IP» с разных адресов.
      KC_PROXY_HEADERS: xforwarded
      # Код на телефон — звонок-сброс, затем SMS. Телефония стенда — заглушка idp-stub:
      # звонки и SMS видны на http://localhost:8190/phone. Пусто — звонки и SMS пишутся в лог Keycloak.
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__PHONE_PROVIDER_URL: ${PHONE_PROVIDER_URL-http://idp-stub:8190/phone}
      # Без адреса провайдера телефонии нет. PHONE_LOG_STUB=true (по умолчанию на стенде) — звонки и SMS с кодами пишутся в
      # лог Keycloak; в бою этого флага нет.
      KC_SPI_AUTHENTICATOR__PLATFORM_CODE_LOGIN__PHONE_STUB: ${PHONE_LOG_STUB:-true}
      # Метрики Prometheus (/metrics на порту управления 9000): отправки кодов, расход, отказы.
      KC_METRICS_ENABLED: "true"
      # Сквозная трассировка (OpenTelemetry): Keycloak продолжает трассу сервиса входа (заголовок traceparent) и пишет её идентификатор
      # в каждую строку журнала — по нему находятся записи обеих сторон. Spans уходят в коллектор по OTLP, если задан AUTH_OTEL_ENDPOINT
      # и AUTH_TRACING_SAMPLER (например, parentbased_always_on); без них spans не записываются, а идентификатор в журнале остаётся.
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: ${AUTH_OTEL_ENDPOINT:-http://localhost:4317}
      KC_TRACING_SAMPLER_TYPE: ${AUTH_TRACING_SAMPLER:-always_off}
      KC_TRACING_SERVICE_NAME: keycloak
      KC_TRACING_JDBC_ENABLED: "false"
      KC_TRACING_INFINISPAN_ENABLED: "false"
      KC_LOG_CONSOLE_INCLUDE_TRACE: "true"
      # Журнал — строки JSON (для сборщика логов); идентификатор трассы — в поле mdc.
      KC_LOG_CONSOLE_OUTPUT: json
      # События входа Keycloak как метрики (keycloak_user_events_total{event,realm,client_id}): успешные и неудачные входы.
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_TAGS: realm,clientId
      KC_EVENT_METRICS_USER_EVENTS: login,logout,code_to_token,refresh_token,client_login,reset_password,update_password
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      # Тема входа — в образе (jar из login-theme/). Правки страниц без Keycloak — npm run dev в login-theme/.
    healthcheck:
      # В образе нет curl — спрашиваем management-порт 9000 через bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  # Заглушка Яндекс ID и Госуслуг (ЕСИА), сервиса подписи ГОСТ и телефонии (звонки и SMS) — для входа без настоящих
  # ключей (infra/idp-stub).
  # Только для песочницы: с настоящими ключами Keycloak ходит к Яндексу и ЕСИА, заглушка не нужна.
  idp-stub:
    image: python:3.13-alpine
    command: ["python", "/stub/stub.py"]
    environment:
      ESIA_CLIENT_ID: ${ESIA_CLIENT_ID:-SANDBOX}
      ESIA_CERTIFICATE_HASH: ${ESIA_CERTIFICATE_HASH:-sandbox-certificate-hash}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-sandbox-yandex}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-sandbox-yandex-secret}
    ports:
      - "${IDP_STUB_PORT:-8190}:8190"
    volumes:
      - ./infra/idp-stub:/stub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8190/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Наблюдаемость стенда (профиль monitoring): docker compose --profile monitoring up -d prometheus grafana.
  # Prometheus — http://localhost:9090, Grafana — http://localhost:3030 (admin / admin), дашборд «Сервис входа».
  # Те же конфиги и дашборд лежат в deploy/monitoring для боя.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.stand.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - auth-service
      - keycloak
      - alertmanager

  # Трассы (профиль monitoring): сервис входа и Keycloak шлют spans по OTLP в коллектор (AUTH_OTEL_ENDPOINT=http://otel-collector:4317 и
  # AUTH_TRACING_SAMPLER=parentbased_always_on при запуске сервисов); коллектор вырезает сведения о людях и передаёт Jaeger,
  # интерфейс — http://localhost:16686.
  otel-collector:
    profiles: [monitoring]
    image: otel/opentelemetry-collector-contrib:0.141.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    profiles: [monitoring]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"

  # Оповещения (профиль monitoring): Prometheus считает правила deploy/monitoring/alerts.yml, Alertmanager шлёт письма в Mailpit
  # (http://localhost:8025), интерфейс — http://localhost:9093.
  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/monitoring/alertmanager.stand.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - mailpit

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  keycloak_postgres_data:
