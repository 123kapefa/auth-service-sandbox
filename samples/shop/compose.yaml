# Магазин проекта «Демо-магазин» (realm demo-shop): «Заказы» (страница и API, http://localhost:5300) и «Уведомления»
# (внутренний, http://localhost:5310). Поверх стенда песочницы и сервиса входа проекта; всё вместе поднимает
#   samples/shop/setup.sh
# Ключи сервисов выдаёт админ проекта («Сервисы и ключи»), секреты — файлами samples/shop/.secrets/*.key (секреты
# compose): сервис перечитывает файл, когда берёт новый токен, — перевыпущенный ключ подхватывается без перезапуска.
# Образы собираются из пакетов artifacts/nuget (scripts/package/pack.sh).
services:
  shop-orders:
    build:
      context: .
      dockerfile: samples/shop/Dockerfile
      args:
        SERVICE: Orders
    image: shop-orders:local
    init: true
    ports:
      - "5300:8080"
    environment:
      Shop__Name: Демо-магазин
      Shop__AuthServiceUrl: http://localhost:8082
      # Realm проекта: iss — внешний адрес Keycloak, ключи и токены по ключу — по адресу внутри сети.
      Authentication__Authority: http://localhost:8180/realms/demo-shop
      Authentication__InternalAuthority: http://keycloak:8180/realms/demo-shop
      ConnectionStrings__Redis: redis:6379
      ServiceToken__ClientSecretFile: /run/secrets/shop-orders-key
      Notifications__BaseUrl: http://shop-notifications:8080/
      AuthService__BaseUrl: http://auth-service-demo-shop:8080/
    secrets:
      - shop-orders-key
    depends_on:
      redis:
        condition: service_healthy
      shop-notifications:
        condition: service_started

  shop-notifications:
    build:
      context: .
      dockerfile: samples/shop/Dockerfile
      args:
        SERVICE: Notifications
    image: shop-notifications:local
    init: true
    ports:
      - "5310:8080"
    environment:
      Authentication__Authority: http://localhost:8180/realms/demo-shop
      Authentication__InternalAuthority: http://keycloak:8180/realms/demo-shop
      ConnectionStrings__Redis: redis:6379
      Notifications__SmtpHost: mailpit
      AuthService__BaseUrl: http://auth-service-demo-shop:8080/
      ServiceToken__ClientSecretFile: /run/secrets/shop-notifications-key
    secrets:
      - shop-notifications-key
    depends_on:
      redis:
        condition: service_healthy

# Секреты ключей — файлы (их пишет samples/shop/setup.sh): ключ не надо класть в окружение, а новый секрет после
# перевыпуска достаточно записать в файл.
secrets:
  shop-orders-key:
    file: samples/shop/.secrets/orders.key
  shop-notifications-key:
    file: samples/shop/.secrets/notifications.key
