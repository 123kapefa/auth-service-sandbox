# Поиск секретов (gitleaks) во всей истории репозитория — на каждый push и pull request (docs/secrets.md#проверка-утечек).
# Отдельный workflow: основной CI (11.1) живёт в своём файле. Исключения — .gitleaks.toml.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история: секрет, удалённый следующим коммитом, всё равно утёк.
          fetch-depth: 0

      - name: Установить gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Проверить историю
        # --redact: найденное значение не попадает в журнал CI (он виден всем, у кого есть доступ к репозиторию).
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
