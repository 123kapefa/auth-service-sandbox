{{- if and .Values.secrets.create .Values.secrets.infisical.enabled }}
{{- fail "secrets.create и secrets.infisical.enabled — что-то одно" }}
{{- end }}
{{- if .Values.secrets.create }}
{{/* Только стенд: Secret из values. Сертификат DataProtection (PFX в base64, как в хранилище) — во второй Secret файлом. */}}
{{- $values := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth.secretName" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := omit $values "AUTH_DATA_PROTECTION_CERT" "AUTH_DATA_PROTECTION_PREVIOUS_CERT" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth.dataProtectionSecretName" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
type: Opaque
data:
  # data — уже base64: в файле пода — сам PFX.
  certificate.pfx: {{ required "нужен secrets.values.AUTH_DATA_PROTECTION_CERT — PFX в base64 (scripts/secrets/new-pfx.sh)" $values.AUTH_DATA_PROTECTION_CERT }}
  {{- with $values.AUTH_DATA_PROTECTION_PREVIOUS_CERT }}
  previous.pfx: {{ . }}
  {{- end }}
{{- end }}
{{- if .Values.secrets.infisical.enabled }}
{{- $inf := .Values.secrets.infisical }}
{{/*
Оператор Infisical (secrets-operator) читает окружение хранилища и кладёт его в два Secret: все секреты — в
<релиз>-secrets (переменные окружения подов), сертификат DataProtection из AUTH_DATA_PROTECTION_CERT (PFX в base64) —
файлом в <релиз>-data-protection. Входит учётка оператора по Kubernetes Auth — токеном ServiceAccount.
*/}}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "auth.name" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  hostAPI: {{ $inf.hostAPI }}
  resyncInterval: {{ $inf.resyncInterval }}
  authentication:
    kubernetesAuth:
      identityId: {{ required "нужен secrets.infisical.identityId — Machine Identity с Kubernetes Auth" $inf.identityId }}
      serviceAccountRef:
        name: {{ required "нужен secrets.infisical.serviceAccount" $inf.serviceAccount }}
        namespace: {{ .Release.Namespace }}
      secretsScope:
        projectSlug: {{ $inf.projectSlug }}
        envSlug: {{ $inf.envSlug }}
        secretsPath: {{ $inf.secretsPath }}
  managedKubeSecretReferences:
    - secretName: {{ include "auth.secretName" . }}
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Orphan
    - secretName: {{ include "auth.dataProtectionSecretName" . }}
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Orphan
      template:
        includeAllSecrets: false
        data:
          certificate.pfx: {{ printf "{{ .AUTH_DATA_PROTECTION_CERT.Value | decodeBase64ToBytes }}" | quote }}
          {{- if .Values.dataProtection.previous }}
          previous.pfx: {{ printf "{{ .AUTH_DATA_PROTECTION_PREVIOUS_CERT.Value | decodeBase64ToBytes }}" | quote }}
          {{- end }}
{{- end }}
