{{- if .Values.ingress.enabled }}
{{- /* use-regex и rewrite-target превращают пути в регулярные выражения без привязки: /realms/shop начал бы совпадать с /realms/shop-test
       и обходить границы, на которых держится закрытие realm master. */ -}}
{{- range $key := (list "nginx.ingress.kubernetes.io/use-regex" "nginx.ingress.kubernetes.io/rewrite-target") }}
{{- if hasKey ($.Values.ingress.annotations | default dict) $key }}
{{- fail (printf "ingress.annotations: «%s» не поддерживается — пути Ingress должны сравниваться по сегментам (закрытие realm master)" $key) }}
{{- end }}
{{- end }}
{{/* Снаружи — https на Ingress; до сервиса и Keycloak — http внутри кластера с X-Forwarded-* от контроллера. */}}
{{- $base := include "auth.name" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $base }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.className "nginx" }}
    # Страницы и ответы Keycloak несут большие заголовки (cookie сессии, токены): стандартного буфера мало.
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ (urlParse .Values.publicUrls.service).hostname }}
        - {{ (urlParse .Values.publicUrls.keycloak).hostname }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ (urlParse (required "нужен publicUrls.service" .Values.publicUrls.service)).hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $base }}-service
                port: { name: http }
    - host: {{ (urlParse (required "нужен publicUrls.keycloak" .Values.publicUrls.keycloak)).hostname }}
      http:
        paths:
          # Снаружи — только realm проекта: страницы входа, токены, ключи. Мастер-админка Keycloak (/admin) и realm master
          # (/realms/master: вход мастер-админа, пароль которого иначе можно перебирать из интернета) снаружи не нужны:
          # техник ходит к ним через kubectl port-forward. Prefix сравнивает по сегментам: /realms/shop не открывает
          # /realms/shop-test и /realms/master.
          - path: /realms/{{ include "auth.realm" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $base }}-keycloak
                port: { name: http }
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: {{ $base }}-keycloak
                port: { name: http }
{{- end }}
