# Prometheus для сервиса входа в поставке deploy/compose.yaml: сервис входа (порт метрик 9100) и Keycloak (порт управления 9000).
# Оба порта не публикуются наружу — Prometheus должен быть в той же сети Docker (или ходить по внутренним адресам кластера).
# Правила оповещений — alerts.yml (подключается ниже). Дашборд для Grafana — grafana/dashboards/auth-service.json.
# Стенд песочницы (корневой compose.yaml, профиль monitoring) использует prometheus.stand.yml: там контейнеры названы иначе.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:9100"]

  # Keycloak: метрики сервера, события входа (keycloak_user_events_total) и плагина кодов (platform_code_*).
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-keycloak:9000"]
