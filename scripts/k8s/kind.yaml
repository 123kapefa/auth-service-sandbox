# Кластер стенда (scripts/k8s/check-kind.sh): один узел, порты NodePort сервиса и Keycloak — на те же адреса, что у
# стенда в Docker (localhost:8080 и localhost:8180), чтобы скрипты проверки работали без правок.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30180
        hostPort: 8180
        listenAddress: 127.0.0.1
