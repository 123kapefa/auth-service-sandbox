# Кластер стенда (scripts/k8s/check-kind.sh): один узел, порты NodePort сервиса и Keycloak — на те же адреса, что у
# стенда в Docker (localhost:8080 и localhost:8180), чтобы скрипты проверки работали без правок. Узел помечен
# ingress-ready и отдаёт 80/443 на localhost:8088/8443 — туда встаёт ingress-nginx для проверки закрытия realm master.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        listenAddress: 127.0.0.1
      - containerPort: 443
        hostPort: 8443
        listenAddress: 127.0.0.1
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30180
        hostPort: 8180
        listenAddress: 127.0.0.1
